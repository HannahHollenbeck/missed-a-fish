<html>

<head>
        <title>misseda.fish</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body style="background:#0000FF;color:#ffffff;text-align:center;">

        <canvas id="fishCanvas" width="400" height="256" style="
                        display:block;
                        margin:0 auto;
                        border:1px solid white;
                ">
        </canvas>
        
        <p id="message" style="
                        margin:0;
                        padding:0;
                ">
        </p>

        <script>
                const now = new Date();

                let hours = now.getHours();
                let minutes = now.getMinutes();

                if (hours > 12) {
                        hours -= 12;
                }

                const isFishTime = (hours == 11 && minutes == 12);

                document.getElementById("message").innerHTML =
                        isFishTime
                                ? "11:12 make a fish"
                                : "come back at 11:12";

                window.isFishTime = isFishTime;
        </script>

        <script src="generate_fish.js"></script>

</body>

</html>
